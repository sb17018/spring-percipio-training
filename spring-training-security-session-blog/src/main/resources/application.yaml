spring:
  application:
    name: spring-training-security-session
  security:
    user:
      username: user
      password: '{noop}password'
  datasource:
    url: jdbc:h2:mem:blog;MODE=MSSQLServer # MODE=MSSQLServer is used to make "SCOPE_IDENTITY()" function in "data.sql" file working
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
server:
  servlet:
    session:
      cookie:
        name: BLOGDATA
        http-only: true
        max-age: 5m
      timeout: 5m
logging:
  level:
    org:
      springframework:
        security: DEBUG